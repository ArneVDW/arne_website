<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub – Arne</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      text-align: center;
      padding: 60px 20px 30px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .game-card h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .game-card p {
      font-size: 15px;
    }

    .play-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #38bdf8;
      color: #020617;
      font-weight: 700;
      text-decoration: none;
    }

    .play-btn:hover {
      background: #0ea5e9;
    }

    footer {
      text-align: center;
      margin: 40px 0 20px;
      color: #9ca3af;
    }

    footer a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>Game Hub</h1>
    <p>Kies een game en begin te spelen</p>
  </header>

  <main>

    <!-- GAME 1 -->
    <div class="game-card">
      <h2>spacegame</h2>
      <p>een space shooter(best uit/inzoomen via je browser)</p>
      <a href="games/spacegame.HTML" class="play-btn">Speel</a>
    </div>

    <!-- GAME 2 -->
    <div class="game-card">
      <h2>Snake</h2>
      <p>De klassieke snake game.</p>
      <a href="games/snake/" class="play-btn">Speel</a>
    </div>

    <!-- GAME 3 -->
    <div class="game-card">
      <h2>Pong</h2>
      <p>Retro pong tegen de computer.</p>
      <a href="games/pong/" class="play-btn">Speel</a>
    </div>

    <!-- NIEUWE GAMES HIERONDER TOEVOEGEN -->

  </main>

  <footer>
    <a href="index.html">← Terug naar mijn website</a>
  </footer>

</body>
</html>
