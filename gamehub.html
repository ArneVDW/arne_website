<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub – Arne</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;
      background: #28165C;
      color: #0f172a ;
    }

    header {
      text-align: center;
      padding: 60px 20px 30px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: #6D3BF5;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .game-card h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .game-card p {
      font-size: 15px;
    }

    .play-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #38bdf8;
      color: #020617;
      font-weight: 700;
      text-decoration: none;
    }

    .play-btn:hover {
      background: #0ea5e9;
    }

    footer {
      text-align: center;
      margin: 40px 0 20px;
      color: #9ca3af;
    }

    footer a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>Game Hub</h1>
    <p>Kies een game en begin te spelen</p>
  </header>

  <main>

    <!-- GAME 1 -->
    <div class="game-card">
      <h2>spacegame</h2>
      <p>een space shooter(best uit/inzoomen via je browser)</p>
      <a href="games/spacegame.HTML" class="play-btn">Speel</a>
    </div>

    <!-- GAME 2 -->
    <div class="game-card">
      <h2>Snake</h2>
      <p>De klassieke snake game.</p>
      <a href="games/snake.html" class="play-btn">Speel</a>
    </div>

    <!-- GAME 3 -->
    <div class="game-card">
      <h2>tetris</h2>
      <p>ja gewoon tetris</p>
      <a href="games/tetris.html" class="play-btn">Speel</a>
    </div>

    <!-- NIEUWE GAMES HIERONDER TOEVOEGEN -->

  </main>

  <footer>
    <a href="index.html">← Terug naar mijn website</a>
  </footer>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let w, h, particles;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();
    function initParticles() { particles = Array.from({ length: 80 }, () => ({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*2+1, dx:(Math.random()-0.5)*0.6, dy:(Math.random()-0.5)*0.6 })); }
    initParticles();
    function drawLines(mouseX, mouseY) {
      particles.forEach(p => {
        const dx = p.x - mouseX, dy = p.y - mouseY, dist = Math.sqrt(dx*dx + dy*dy);
        if(dist<120){ctx.strokeStyle=`rgba(56,189,248,${1-dist/120})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mouseX,mouseY);ctx.stroke();}
      });
    }
    let mouse={x:null,y:null};
    window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
    function animateParticles(){ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(56,189,248,0.6)';particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>w)p.dx*=-1;if(p.y<0||p.y>h)p.dy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});if(mouse.x&&mouse.y){drawLines(mouse.x,mouse.y);}requestAnimationFrame(animateParticles);}
    animateParticles();
    window.addEventListener('load',()=>document.querySelector('footer').style.opacity='1');
  </script>

</body>
</html>
