<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
        }

        h1 {
            color: #4CAF50;
        }

        #game-container {
            border: 5px solid #333;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        #gameCanvas {
            background-color: #000;
            display: block; /* Removes any extra space below the canvas */
        }

        #score-board {
            font-size: 1.5rem;
            margin-top: 15px;
        }

        #instructions {
            margin-top: 20px;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>Classic Snake Game</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div id="score-board">
        Score: <span id="score">0</span>
    </div>

    <div id="instructions">
        Gebruik de pijltjes om te bewegen, druk op enter om te herstarten
    </div>

    <script>
        // --- 1. SETUP ---

        // Get elements from the HTML
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // Game constants
        const TILE_SIZE = 20; // The size of each grid square (snake part, food)
        const TILE_COUNT = canvas.width / TILE_SIZE; // 400 / 20 = 20 (a 20x20 grid)
        const GAME_SPEED = 120; // Milliseconds per game tick (lower is faster)

        // Game state variables
        let snake;
        let food;
        let direction;
        let nextDirection; // Input buffer to prevent 180-degree turns
        let score;
        let gameOver;
        let gameLoopInterval;

        // --- 2. GAME FUNCTIONS ---

        /**
         * Initializes or resets the game state.
         */
        function startGame() {
            // Initial snake state: 3 parts, starting in the middle, moving right
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            
            // Initial movement direction
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            
            score = 0;
            gameOver = false;
            scoreElement.textContent = score;

            // Place the first piece of food
            generateFood();
            
            // Clear any existing game loop and start a new one
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
            }
            gameLoopInterval = setInterval(gameLoop, GAME_SPEED);
        }

        /**
         * The main game loop, runs every GAME_SPEED milliseconds.
         */
        function gameLoop() {
            if (gameOver) {
                // If game is over, stop the loop and show message
                clearInterval(gameLoopInterval);
                drawGameOver();
                return;
            }
            
            updateState(); // Update positions and check for collisions
            draw();        // Render the game state to the canvas
        }

        /**
         * Updates the snake's position and checks for collisions or food.
         */
        function updateState() {
            // Update the current direction from the input buffer
            direction = nextDirection;
            
            // Calculate the new head position
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Check for wall collision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver = true;
                return;
            }

            // Check for self-collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver = true;
                    return;
                }
            }

            // Add the new head to the front of the snake
            snake.unshift(head);

            // Check for food
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;
                generateFood();
                // Don't pop the tail, making the snake grow
            } else {
                // Remove the tail
                snake.pop();
            }
        }

        /**
         * Renders the game (snake, food, background) to the canvas.
         */
        function draw() {
            // Clear the canvas with a black background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the snake (green)
            ctx.fillStyle = '#00FF00';
            snake.forEach(part => {
                // Draw a rectangle for each snake part, with a 1px gap for grid effect
                ctx.fillRect(part.x * TILE_SIZE, part.y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
            });

            // Draw the food (red)
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
        }

        /**
         * Displays the "Game Over" message.
         */
        function drawGameOver() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = '20px Arial';
            ctx.fillText('Press Enter to Restart', canvas.width / 2, canvas.height / 2 + 20);
        }

        /**
         * Generates a new piece of food at a random location.
         */
        function generateFood() {
            let newFoodPos;
            do {
                // Find a random x/y coordinate on the grid
                newFoodPos = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
            } while (isFoodOnSnake(newFoodPos)); // Keep trying until it's not on the snake
            
            food = newFoodPos;
        }

        /**
         * Helper function to check if a position is on the snake's body.
         * @param {object} pos - The position to check ({x, y}).
         * @returns {boolean} - True if the position is on the snake.
         */
        function isFoodOnSnake(pos) {
            return snake.some(part => part.x === pos.x && part.y === pos.y);
        }

        /**
         * Handles all key presses.
         * @param {KeyboardEvent} event - The keyboard event.
         */
        function handleKeyDown(event) {
            const keyPressed = event.key;
            
            // Restart the game
            if (gameOver && keyPressed === 'Enter') {
                startGame();
                return;
            }

            // Prevent the snake from reversing onto itself
            if (keyPressed === 'ArrowUp' && direction.y === 0) {
                nextDirection = { x: 0, y: -1 };
            } else if (keyPressed === 'ArrowDown' && direction.y === 0) {
                nextDirection = { x: 0, y: 1 };
            } else if (keyPressed === 'ArrowLeft' && direction.x === 0) {
                nextDirection = { x: -1, y: 0 };
            } else if (keyPressed === 'ArrowRight' && direction.x === 0) {
                nextDirection = { x: 1, y: 0 };
            }
        }

        // --- 3. START GAME ---

        // Listen for key presses
        document.addEventListener('keydown', handleKeyDown);
        
        // Run the game for the first time
        startGame();

    </script>
</body>

</html>
